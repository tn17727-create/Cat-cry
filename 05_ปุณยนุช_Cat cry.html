<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Effect Game: ยิ้มหรือบึ้ง!</title>
    <!-- Load Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load MediaPipe Tasks Vision -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.js" crossorigin="anonymous"></script>

    <style>
        body {
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 640px; /* Standard webcam width */
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            background-color: #000;
        }

        #webcam {
            width: 100%;
            height: auto;
            display: block;
            transform: scaleX(-1); /* Mirror the video */
        }

        #output_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through to video if needed */
            transform: scaleX(-1); /* Mirror the canvas to match video */
            z-index: 10;
        }

        .controls {
            margin-top: 20px;
            text-align: center;
        }
        
        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 9999px;
            font-weight: bold;
            font-size: 1.1rem;
            margin-top: 10px;
            transition: all 0.3s ease;
        }
        
        .status-neutral { background-color: #e2e8f0; color: #475569; }
        .status-smile { background-color: #dcfce7; color: #166534; box-shadow: 0 0 10px #22c55e; }
        .status-sad { background-color: #dbeafe; color: #1e40af; box-shadow: 0 0 10px #3b82f6; }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 20;
        }
    </style>
</head>
<body class="p-4">
    
    <div class="mb-4 text-center">
        <h1 class="text-3xl font-extrabold text-white drop-shadow-md mb-2">เกมส์วัดอารมณ์!</h1>
        <p class="text-white drop-shadow-sm font-medium">ยิ้มกว้างๆ เพื่อดูหนวดแมว 😸 | ทำหน้าบึ้งเพื่อดูน้ำตา 😭</p>
    </div>

    <div class="container relative" id="video-container">
        <div id="loading">กำลังโหลดโมเดล... กรุณารอสักครู่</div>
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <div class="controls">
        <button id="webcamButton" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-full shadow-lg transform transition hover:scale-105 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
            เปิดกล้อง
        </button>
        <div id="emotion-status" class="status-badge status-neutral hidden mt-4">
            รอการตรวจจับใบหน้า...
        </div>
    </div>

    <script type="module">
        import {
            FaceLandmarker,
            FilesetResolver,
            DrawingUtils
        } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

        const video = document.getElementById("webcam");
        const canvasElement = document.getElementById("output_canvas");
        const canvasCtx = canvasElement.getContext("2d");
        const enableWebcamButton = document.getElementById("webcamButton");
        const loadingText = document.getElementById("loading");
        const emotionStatus = document.getElementById("emotion-status");

        let faceLandmarker;
        let runningMode = "VIDEO";
        let webcamRunning = false;
        let lastVideoTime = -1;
        let results = undefined;
        let drawingUtils;
        
        // Animation variables for tears
        let tearDrops = [];
        const MAX_TEARS = 10;
        let frameCount = 0;

        // Load images for effects (using emojis drawn on canvas as fallback if external images fail, but we will draw them directly for better performance and guaranteed load)
        
        // Before we can use FaceLandmarker class we must wait for it to finish
        // loading. Machine Learning models can be large and take a moment to
        // get everything needed to run.
        async function createFaceLandmarker() {
            try {
                const filesetResolver = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
                );
                faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
                    baseOptions: {
                        modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task`,
                        delegate: "GPU"
                    },
                    outputFaceBlendshapes: true,
                    runningMode: runningMode,
                    numFaces: 1
                });
                loadingText.style.display = "none";
                enableWebcamButton.disabled = false;
                console.log("FaceLandmarker loaded completely");
            } catch (error) {
                console.error("Error loading FaceLandmarker:", error);
                loadingText.innerText = "เกิดข้อผิดพลาดในการโหลดโมเดล";
            }
        }
        createFaceLandmarker();

        // Check if webcam access is supported.
        function hasGetUserMedia() {
            return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
        }

        // If webcam supported, add event listener to button for when user
        // wants to activate it.
        if (hasGetUserMedia()) {
            enableWebcamButton.addEventListener("click", enableCam);
        } else {
            console.warn("getUserMedia() is not supported by your browser");
            enableWebcamButton.innerText = "เบราว์เซอร์ไม่รองรับการเปิดกล้อง";
        }

        // Enable the live webcam view and start detection.
        function enableCam(event) {
            if (!faceLandmarker) {
                console.log("Wait! faceLandmarker not loaded yet.");
                return;
            }

            if (webcamRunning === true) {
                webcamRunning = false;
                enableWebcamButton.innerText = "เปิดกล้อง";
                const stream = video.srcObject;
                if (stream) {
                    const tracks = stream.getTracks();
                    tracks.forEach(track => track.stop());
                }
                emotionStatus.classList.add('hidden');
            } else {
                webcamRunning = true;
                enableWebcamButton.innerText = "ปิดกล้อง";
                emotionStatus.classList.remove('hidden');
                emotionStatus.innerText = "กำลังวิเคราะห์ใบหน้า...";
                emotionStatus.className = 'status-badge status-neutral mt-4';

                // getUsermedia parameters.
                const constraints = {
                    video: { width: 640, height: 480 } // Prefer a standard resolution
                };

                // Activate the webcam stream.
                navigator.mediaDevices.getUserMedia(constraints).then((stream) => {
                    video.srcObject = stream;
                    video.addEventListener("loadeddata", predictWebcam);
                }).catch((err) => {
                    console.error("Error accessing webcam:", err);
                    alert("ไม่สามารถเข้าถึงกล้องได้ กรุณาตรวจสอบสิทธิ์");
                    webcamRunning = false;
                    enableWebcamButton.innerText = "เปิดกล้อง";
                });
            }
        }

        async function predictWebcam() {
            canvasElement.style.width = video.videoWidth;
            canvasElement.style.height = video.videoHeight;
            canvasElement.width = video.videoWidth;
            canvasElement.height = video.videoHeight;
            
            // Re-initialize DrawingUtils with new canvas context
            drawingUtils = new DrawingUtils(canvasCtx);

            // Now let's start detecting the stream.
            if (runningMode === "IMAGE") {
                runningMode = "VIDEO";
                await faceLandmarker.setOptions({ runningMode: runningMode });
            }
            
            let startTimeMs = performance.now();
            if (lastVideoTime !== video.currentTime) {
                lastVideoTime = video.currentTime;
                results = faceLandmarker.detectForVideo(video, startTimeMs);
            }
            
            // Clear canvas
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (results && results.faceBlendshapes && results.faceBlendshapes.length > 0) {
                const blendshapes = results.faceBlendshapes[0].categories;
                const landmarks = results.faceLandmarks[0];
                
                // Helper to get blendshape score
                const getScore = (name) => {
                    const shape = blendshapes.find(b => b.categoryName === name);
                    return shape ? shape.score : 0;
                };

                // Detect Smile (using mouthSmileLeft and mouthSmileRight)
                const smileScoreLeft = getScore('mouthSmileLeft');
                const smileScoreRight = getScore('mouthSmileRight');
                const isSmiling = (smileScoreLeft + smileScoreRight) / 2 > 0.4;

                // Detect Frown/Sad (using mouthFrownLeft, mouthFrownRight, browDownLeft, browDownRight)
                const frownScore = (getScore('mouthFrownLeft') + getScore('mouthFrownRight')) / 2;
                const browDownScore = (getScore('browDownLeft') + getScore('browDownRight')) / 2;
                // High frown score OR significant brow down with some frown usually means sad/angry
                const isSad = frownScore > 0.3 || (browDownScore > 0.4 && frownScore > 0.1);

                // Update Status UI
                updateStatusUI(isSmiling, isSad);

                // Draw Effects
                if (isSmiling) {
                    drawCatWhiskers(landmarks);
                    // Clear tears if smiling
                    tearDrops = [];
                } else if (isSad) {
                    drawTears(landmarks);
                } else {
                     // Clear tears if neutral
                    tearDrops = [];
                }
                
                frameCount++;
            } else {
                 updateStatusUI(false, false, true);
                 tearDrops = []; // Clear tears if no face
            }

            // Call this function again to keep predicting when the browser is ready.
            if (webcamRunning === true) {
                window.requestAnimationFrame(predictWebcam);
            }
        }
        
        function updateStatusUI(isSmiling, isSad, noFace = false) {
             if (noFace) {
                 emotionStatus.innerText = "ไม่พบใบหน้า";
                 emotionStatus.className = 'status-badge status-neutral mt-4';
                 return;
             }
             
             if (isSmiling) {
                 emotionStatus.innerText = "😁 ยิ้มกว้างจัง (หนวดแมวมาแล้ว!)";
                 emotionStatus.className = 'status-badge status-smile mt-4';
             } else if (isSad) {
                 emotionStatus.innerText = "😭 หน้าบึ้งเลย (อย่าร้องไห้นะ)";
                 emotionStatus.className = 'status-badge status-sad mt-4';
             } else {
                 emotionStatus.innerText = "😐 หน้านิ่งๆ...";
                 emotionStatus.className = 'status-badge status-neutral mt-4';
             }
        }

        function drawCatWhiskers(landmarks) {
            const w = canvasElement.width;
            const h = canvasElement.height;
            
            // Nose tip landmark index is 1
            const noseTip = landmarks[1];
            // Left cheek area (approximate)
            const leftCheek = landmarks[205]; 
            // Right cheek area (approximate)
            const rightCheek = landmarks[425];
            
            if (!noseTip || !leftCheek || !rightCheek) return;
            
            canvasCtx.save();
            canvasCtx.lineWidth = 3;
            canvasCtx.strokeStyle = "white";
            canvasCtx.lineCap = "round";
            
            // Draw cute cat nose
            canvasCtx.beginPath();
            canvasCtx.arc(noseTip.x * w, noseTip.y * h, 8, 0, 2 * Math.PI);
            canvasCtx.fillStyle = "pink";
            canvasCtx.fill();
            canvasCtx.stroke();

            // Draw Whiskers Left Side (Remember canvas is mirrored, so left on image is right on screen)
            drawWhiskerLines(leftCheek.x * w, leftCheek.y * h, -1, noseTip.z);
            
            // Draw Whiskers Right Side
            drawWhiskerLines(rightCheek.x * w, rightCheek.y * h, 1, noseTip.z);

            canvasCtx.restore();
        }
        
        function drawWhiskerLines(startX, startY, direction, zDepth) {
            // Adjust length based loosely on depth (z)
            const length = 50 * (1 - (zDepth || 0)); 
            
            canvasCtx.beginPath();
            
            // Top whisker
            canvasCtx.moveTo(startX, startY);
            canvasCtx.quadraticCurveTo(startX + (30 * direction), startY - 10, startX + (length * direction), startY - 20);
            
            // Middle whisker
            canvasCtx.moveTo(startX, startY + 5);
            canvasCtx.quadraticCurveTo(startX + (30 * direction), startY + 5, startX + (length * direction), startY + 5);
            
            // Bottom whisker
            canvasCtx.moveTo(startX, startY + 10);
            canvasCtx.quadraticCurveTo(startX + (30 * direction), startY + 20, startX + (length * direction), startY + 30);
            
            canvasCtx.stroke();
        }

        function drawTears(landmarks) {
            const w = canvasElement.width;
            const h = canvasElement.height;
            
            // Inner bottom of left eye (approx) -> Landmark 159 is top, 145 is bottom
            const leftEyeBottom = landmarks[145];
            // Inner bottom of right eye (approx) -> Landmark 386 is top, 374 is bottom
            const rightEyeBottom = landmarks[374];
            
            if (!leftEyeBottom || !rightEyeBottom) return;

            // Generate new tears occasionally
            if (frameCount % 10 === 0 && tearDrops.length < MAX_TEARS) {
                // Decide which eye to drop from
                const eye = Math.random() > 0.5 ? leftEyeBottom : rightEyeBottom;
                
                tearDrops.push({
                    x: eye.x * w,
                    y: eye.y * h,
                    speedY: 2 + Math.random() * 3,
                    speedX: (Math.random() - 0.5) * 1, // Slight horizontal drift
                    size: 4 + Math.random() * 3,
                    alpha: 1.0
                });
            }

            // Update and draw tears
            canvasCtx.save();
            canvasCtx.fillStyle = "rgba(100, 200, 255, 0.8)";
            canvasCtx.strokeStyle = "rgba(50, 150, 255, 0.6)";
            canvasCtx.lineWidth = 1;

            for (let i = tearDrops.length - 1; i >= 0; i--) {
                let tear = tearDrops[i];
                
                // Draw tear shape (simple teardrop)
                canvasCtx.globalAlpha = tear.alpha;
                canvasCtx.beginPath();
                canvasCtx.arc(tear.x, tear.y, tear.size, 0, Math.PI); // Bottom half circle
                // Top point
                canvasCtx.moveTo(tear.x - tear.size, tear.y);
                canvasCtx.lineTo(tear.x, tear.y - tear.size * 1.5);
                canvasCtx.lineTo(tear.x + tear.size, tear.y);
                canvasCtx.fill();
                canvasCtx.stroke();

                // Update position
                tear.y += tear.speedY;
                tear.x += tear.speedX;
                
                // Fade out slightly as it drops
                tear.alpha -= 0.01;

                // Remove if off screen or faded out
                if (tear.y > h || tear.alpha <= 0) {
                    tearDrops.splice(i, 1);
                }
            }
            canvasCtx.restore();
        }
        
    </script>
</body>
</html>
